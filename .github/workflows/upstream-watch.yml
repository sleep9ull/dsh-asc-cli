name: upstream-watch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download latest asc and verify SHA-256
        run: node scripts/download-asc.mjs --latest
      - name: Contract test
        run: node scripts/contract.mjs ./vendor/asc
      - name: Completion and side-effect flag audit
        run: node scripts/classify-audit.mjs ./vendor/asc
      - name: Offline smoke against latest
        run: node scripts/smoke.mjs ./vendor/asc --latest
      - name: Open an issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'asc CLI contract drift detected'
            const body = [
              'The scheduled contract test against the latest `asc` release failed.',
              '',
              'Run `node scripts/download-asc.mjs --latest`, then the contract, classify-audit and offline smoke scripts locally. Review the failed stage and update the compatibility baseline only after verification.',
            ].join('\n')
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-drift', per_page: 100 })
            if (!existing.some(issue => issue.title === title)) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-drift'] })
            }

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve host-compatible Harness candidate and verify independent observations
        run: node scripts/maintenance/cli.mjs harness-watch > harness-watch.json
      - name: Preserve discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-default-channel
          path: harness-watch.json
          retention-days: 14
      - name: Summarize compatible candidate and independent observations
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const report = JSON.parse(readFileSync('harness-watch.json', 'utf8'))
          const lines = ['## Harness compatibility discovery', `Status: ${report.status}`, 'Resolution is a candidate, not integration certification.']
          if (report.reason) lines.push(`Reason: ${report.reason}`)
          for (const change of report.changes ?? []) lines.push(`- Candidate ${change.name}: ${change.installed} -> ${change.candidate}`)
          for (const item of report.observations ?? []) lines.push(`- Observation ${item.name}: latest ${item.version}, host-selected ${item.selected} (${item.reason})`)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n')
          JS
      - name: Open an issue on Harness drift or unavailable discovery
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Harness default-channel drift or discovery failure detected'
            const body = [
              'The host-compatible Harness candidate differs from the verified baseline, or dependency/artifact verification failed. Independent latest tags are observations, not an installation target.',
              '',
              `Inspect the harness-default-channel artifact: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This is discovery evidence, not an integration certification. Follow docs/MAINTENANCE.md in an explicitly deployed Desktop maintenance routine. This workflow does not adapt code, create a PR, merge or publish.',
            ].join('\n')
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-drift', per_page: 100 })
            if (!existing.some(issue => issue.title === title)) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-drift'] })
            }
