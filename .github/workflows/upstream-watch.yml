name: upstream-watch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download latest asc and verify SHA-256
        run: node scripts/download-asc.mjs --latest
      - name: Contract test
        run: node scripts/contract.mjs ./vendor/asc
      - name: Completion and side-effect flag audit
        run: node scripts/classify-audit.mjs ./vendor/asc
      - name: Offline smoke against latest
        run: node scripts/smoke.mjs ./vendor/asc --latest
      - name: Open an issue on drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'asc CLI contract drift detected'
            const body = [
              'The scheduled contract test against the latest `asc` release failed.',
              '',
              'Run `node scripts/download-asc.mjs --latest`, then the contract, classify-audit and offline smoke scripts locally. Review the failed stage and update the compatibility baseline only after verification.',
            ].join('\n')
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'upstream-drift' })
            if (existing.data.length === 0) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['upstream-drift'] })
            }
