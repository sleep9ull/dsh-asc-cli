name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Types, unit and real Harness integration, build, package and guards
        run: npm run verify -- --unit-only
      - name: Same package on both Harness versions (verified artifacts, strict install and real approvals)
        run: node scripts/harness-matrix.mjs

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download compatibility baseline and verify SHA-256
        run: node scripts/download-asc.mjs
      - name: Command and flag contract
        run: node scripts/contract.mjs ./vendor/asc
      - name: Completion and side-effect flag audit
        run: node scripts/classify-audit.mjs ./vendor/asc
      - name: Offline smoke through real Harness subprocess
        run: node scripts/smoke.mjs ./vendor/asc
